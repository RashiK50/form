<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Santa Survey Form</title>
    <link rel="stylesheet" href="improve.css">
</head>
<body>
    <main class="page-shell">
        <section class="form-card">
            <div class="hero-copy">
                <p class="eyebrow">Secret Santa Survey</p>
                <h1>Share a few details and get matched with the perfect gift vibe.</h1>
                <p class="intro">Sections marked with * are required. Keep it short, fun, and festive.</p>
            </div>

            <form class="survey-form" action="/submit" method="post">
                <div class="section-heading">
                    <h2>Your information</h2>
                </div>

                <div class="field-grid">
                    <label class="field">
                        <span>Name *</span>
                        <input type="text" required name="name" placeholder="Saurabh Salunke">
                    </label>

                    <label class="field">
                        <span>Age</span>
                        <input type="number" name="age" placeholder="30">
                    </label>

                    <label class="field field-wide">
                        <span>Favorite Color</span>
                        <input type="color" name="favoriteColor" value="#2a8ea5">
                    </label>
                </div>

                <fieldset class="fieldset">
                    <legend>Gender *</legend>
                    <label class="option"><input type="radio" name="gender" value="male"> Male</label>
                    <label class="option"><input type="radio" name="gender" value="female"> Female</label>
                </fieldset>

                <div class="field-grid">
                    <label class="field field-wide">
                        <span>Your Hobbies</span>
                        <textarea name="hobbies" rows="4" placeholder="Painting, music, gaming, baking..."></textarea>
                    </label>

                    <label class="field field-wide">
                        <span>Secret Wish</span>
                        <textarea name="wish" rows="4" placeholder="Something you would really love to receive"></textarea>
                    </label>

                    <label class="field field-wide">
                        <span>Address *</span>
                        <textarea name="address" rows="4" required placeholder="Street, city, zip code"></textarea>
                    </label>

                    <label class="field field-wide inline-check">
                        <input type="checkbox" name="ready">
                        <span>Ready to have a blast?</span>
                    </label>

                    <label class="field">
                        <span>Date of form filling</span>
                        <input type="date" name="dateFilled">
                    </label>
                </div>

                <div class="actions">
                    <input type="reset" value="Reset">
                    <input type="submit" value="Submit">
                </div>
            </form>
        </section>
    </main>
</body>
</html>
